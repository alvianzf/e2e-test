<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Task List</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 48px auto; color: #2b2b2b; }
    h1 { font-size: 22px; }
    .row { display: flex; gap: 8px; }
    input { flex: 1; padding: 8px; font-size: 14px; }
    button { padding: 8px 14px; font-size: 14px; cursor: pointer; }
    #error-message { color: #c0392b; margin-top: 8px; display: none; font-size: 13px; }
    #error-message.visible { display: block; }
    ul { list-style: none; padding: 0; margin-top: 20px; }
    .task-item { padding: 8px 0; border-bottom: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>Task List</h1>

  <div class="row">
    <input type="text" id="task-input" data-testid="task-input" placeholder="New task..." />
    <button id="add-task" data-testid="add-task-button">Add Task</button>
  </div>

  <div id="error-message" data-testid="error-message">Task title is required</div>

  <ul id="task-list"></ul>

  <script>
    const input = document.getElementById('task-input');
    const button = document.getElementById('add-task');
    const list = document.getElementById('task-list');
    const errorMsg = document.getElementById('error-message');

    button.addEventListener('click', async () => {
      const title = input.value.trim();
      errorMsg.classList.remove('visible');

      if (!title) {
        errorMsg.classList.add('visible');
        return;
      }

      const res = await fetch('/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title }),
      });

      if (res.ok) {
        const task = await res.json();
        const li = document.createElement('li');
        li.className = 'task-item';
        li.setAttribute('data-testid', 'task-item');
        li.textContent = task.title;
        list.appendChild(li);
        input.value = '';
      }
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') button.click();
    });
  </script>
</body>
</html>
